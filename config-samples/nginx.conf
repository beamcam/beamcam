# nginx: static app + signaling proxy. Replace cam.example.org with your
# APP_DOMAIN, the root with the absolute path of dist/, and point the
# certificate lines at your own (e.g. certbot).

server {
    listen 443 ssl http2;
    server_name cam.example.org;

    ssl_certificate     /etc/letsencrypt/live/cam.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cam.example.org/privkey.pem;

    root /srv/cam/dist;
    index index.html;

    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), screen-wake-lock=(self)";
    add_header Referrer-Policy "no-referrer";
    add_header X-Content-Type-Options "nosniff";

    # Signaling server (HTTP + WebSocket)
    location /peerjs {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name cam.example.org;
    return 301 https://$host$request_uri;
}
